<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 | HHYYYY</title>
    <meta name="description" content="在 HHYYYY 的个人主页留言板上留下你想说的话吧。">
    <meta name="author" content="HHYYYY">
    <meta name="theme-color" content="#eef0f4">
    <link rel="icon" href="/logo/H_.png" type="image/png">

    <!-- 主题：首帧前把模式与生效主题写入 <html>，避免加载瞬间闪白/闪黑与图标错位。
         有本地记录用记录值，否则跟随系统偏好；后续三态循环见 js/theme.js -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) { /* 隐私模式：按未选择处理 */ }
            var mode = (stored === 'dark' || stored === 'light') ? stored : 'auto';
            var theme = mode === 'auto'
                ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
                : mode;
            var root = document.documentElement;
            root.setAttribute('data-theme-mode', mode);
            root.setAttribute('data-theme', theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', theme === 'dark' ? '#121212' : '#eef0f4');
            }
        })();
    </script>

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/comment.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>

<body>
    <!-- site-header: rendered synchronously by js/layout.js -->
    <div id="site-header"></div>

    <main class="background">
        <h2 data-lang-key="Comment">留言板</h2>
        <h4 data-lang-key="来这里留下你想说的话吧">来这里留下你想说的话吧</h4>
        <div id="comment">
            <div id="tcomment"></div>
        </div>
    </main>

    <!-- site-footer: rendered synchronously by js/layout.js -->
    <div id="site-footer"></div>

    <!-- 脚本统一移至 body 末尾，避免阻塞渲染 -->
    <script src="/js/layout.js"></script>
    <script src="/js/jquery-3.7.1.min.js"></script>
    <script src="/js/popper.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/commentlang.js"></script>
    <script src="/js/twikoo.min.js"></script>
    <script>
        twikoo.init({
            envId: 'https://hhyyyy-twikoo.netlify.app/.netlify/functions/twikoo', // 腾讯云环境填 envId；Vercel 环境填地址（https://xxx.vercel.app）
            el: '#tcomment', // 容器元素
            // region: 'ap-guangzhou', // 环境地域，默认为 ap-shanghai，腾讯云环境填 ap-shanghai 或 ap-guangzhou；Vercel 环境不填
            // path: location.pathname, // 用于区分不同文章的自定义 js 路径，如果您的文章路径不是 location.pathname，需传此参数
            // lang: 'zh-CN', // 用于手动设定评论区语言，支持的语言列表 https://github.com/twikoojs/twikoo/blob/main/src/client/utils/i18n/index.js
        });
    </script>
</body>
</html>
